<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Product Information</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Icons+Outlined">
<style>
/* InFlow light tokens. The product UI under test is light only, so every participant sees the same screen. */
:root{
  color-scheme: light;
  --nav-surface:#0b2d6e; --on-primary:#ffffff; --navy-700:#0b2d6e; --navy-800:#22243d; --navy-100:#ebf1fc; --navy-dark:#003687;
  --primary-tab:#c3defe; --app-background:#ebf1fc; --surface-lowest:#ffffff; --surface-low:#f1f6fe; --surface-variant:#d8e0f4;
  --outline-variant:#c2c6d8; --outline:#727787; --on-surface:#191b24; --on-surface-variant:#424655;
  --info:#0057cf; --success:#2c9b4b; --alert-info-bg:#dbe8ff; --alert-success-bg:#dcefe1;
  --nav-item-hover:rgba(255,255,255,0.08); --row-hover:#f1f6fe; --inverse-surface:#2e3038; --inverse-on-surface:#f0f0f7;
  --flyout-shadow:0 8px 24px rgba(0,0,0,0.18);
  --font-sans:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--app-background);color:var(--on-surface);font:400 14px/20px var(--font-sans)}
.mi{font-family:'Material Icons Outlined';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.tbtn:disabled{opacity:.4;cursor:not-allowed !important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3,p{margin:0}

/* shell */
.app{display:flex;min-height:100vh}
.rail{width:76px;flex-shrink:0;background:var(--nav-surface);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:6px;position:relative;z-index:40}
.ri{display:flex;flex-direction:column;align-items:center;gap:5px;width:72px;padding:6px 0;border:none;background:transparent;border-radius:8px;cursor:pointer;color:var(--on-primary)}
.ri:hover{background:var(--nav-item-hover)}
.ri.static{cursor:default}.ri.static:hover{background:transparent}
.pill{position:relative;width:44px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.pill .mi{font-size:20px;color:var(--on-primary)}
.pill.on{background:var(--surface-lowest)}.pill.on .mi{color:var(--navy-700)}
.rl{font-size:11px;line-height:13px;text-align:center}
.lockb{position:absolute;top:-6px;right:-8px;width:16px;height:16px;border-radius:9999px;background:var(--primary-tab);box-shadow:0 0 0 2px var(--nav-surface);display:flex;align-items:center;justify-content:center}
.lockb .mi{font-size:11px;color:var(--navy-700)}
.newb{position:absolute;top:-7px;right:-14px;background:var(--info);color:var(--on-primary);font:700 9px/1 var(--font-sans);letter-spacing:.4px;padding:3px 5px;border-radius:9999px;box-shadow:0 0 0 2px var(--nav-surface)}
.wrap{position:relative;width:76px;display:flex;justify-content:center}
.tip{position:absolute;left:100%;top:50%;transform:translateY(-50%);margin-left:4px;z-index:60;background:var(--inverse-surface);color:var(--inverse-on-surface);font:400 12px/17px var(--font-sans);padding:8px 11px;border-radius:4px;width:200px}
.fly{position:absolute;left:72px;top:-4px;padding-left:8px;z-index:60}
.flyin{width:264px;background:var(--surface-lowest);border:1px solid var(--outline-variant);border-radius:8px;box-shadow:var(--flyout-shadow);overflow:hidden}
.flyt{padding:12px 16px;font-size:16px;line-height:24px;font-weight:600;color:var(--navy-700);border-bottom:1px solid var(--outline-variant)}
.flyl{padding:6px;display:flex;flex-direction:column;gap:2px}
.mitem{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:none;background:transparent;border-radius:5px;font:400 14px/20px var(--font-sans);color:var(--navy-700);cursor:pointer;text-align:left}
.mitem:hover{background:var(--row-hover)}
.mitem[aria-disabled="true"]{color:var(--on-surface-variant);cursor:default}.mitem[aria-disabled="true"]:hover{background:transparent}
.mitem .grow{flex:1}
.mitem{position:relative}
.mitem[data-tip]:hover::after,.mitem[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);width:220px;background:var(--inverse-surface);color:var(--inverse-on-surface);font:400 12px/17px var(--font-sans);padding:8px 11px;border-radius:4px;z-index:70;text-align:left;white-space:normal;pointer-events:none}
.flyin{overflow:visible}
.flyn{padding:4px 16px 16px;display:flex;flex-direction:column;gap:12px}
.flyn p{font-size:13px;line-height:18px;color:var(--on-surface-variant)}
.right{display:flex;justify-content:flex-end}

main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:64px;flex-shrink:0;background:var(--surface-lowest);display:flex;align-items:center;gap:20px;padding:0 24px;border-bottom:1px solid var(--outline-variant)}
.search{flex:1;max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;height:40px;padding:0 14px;background:var(--navy-100);border-radius:6px;color:var(--on-surface-variant)}
.search .mi{font-size:20px;color:var(--navy-700)}
.ticons{display:flex;align-items:center;gap:4px}
.ib{width:40px;height:40px;border:none;background:transparent;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--navy-700)}
.avatar{width:40px;height:40px;border-radius:9999px;background:var(--navy-700);margin-left:6px;flex-shrink:0}
.page{padding:24px;display:flex;flex-direction:column;gap:24px}

/* components */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:5px;border:1px solid transparent;background:var(--navy-700);color:var(--on-primary);font:500 14px/1 var(--font-sans);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--navy-dark)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn.lg{height:48px;padding:0 22px;font-size:15px}
.btn.out{background:var(--surface-lowest);color:var(--navy-700);border-color:var(--outline-variant)}
.btn.out:hover{background:var(--surface-low)}
.btn.txt{background:transparent;color:var(--navy-700);padding:0 8px}
.btn.txt:hover{background:var(--surface-low)}
.btn[disabled]{background:#e0e0e0;color:#6b6b6b;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:9999px;background:var(--surface-variant);color:var(--on-surface);font-size:12px;font-weight:500;white-space:nowrap}
.chip.new{background:var(--navy-700);color:var(--on-primary)}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:5px;background:var(--alert-info-bg);color:var(--on-surface)}
.alert .mi{font-size:22px;color:var(--info)}
.alert.ok{background:var(--alert-success-bg)}.alert.ok .mi{color:var(--success)}
.alert b{display:block;font-weight:600;margin-bottom:2px}
.track{height:4px;border-radius:9999px;background:var(--navy-100);overflow:hidden}
.track>div{height:100%;background:var(--navy-700);transition:width .2s}
.card{background:var(--surface-lowest);border:1px solid var(--outline-variant);border-radius:5px}
.ch{display:flex;align-items:center;gap:10px;padding:16px 16px 0}
.ch .mi{font-size:20px;color:var(--on-surface-variant)}
.ch h2{flex:1;font-size:18px;line-height:26px;font-weight:600;color:var(--navy-700)}
.muted{color:var(--on-surface-variant)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;align-items:start}
.span2{grid-column:span 2}
.tabs{display:flex;padding:12px 16px 0;border-bottom:1px solid var(--outline-variant)}
.tabs span{flex:1;text-align:center;padding:8px 0;font-size:14px;color:var(--on-surface-variant)}
.tabs span.on{font-weight:600;color:var(--navy-700);border-bottom:2px solid var(--navy-700);margin-bottom:-1px}
.row{border-bottom:1px solid var(--outline-variant)}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:24px;text-align:center}
.icirc{width:48px;height:48px;border-radius:9999px;background:var(--navy-100);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icirc .mi{color:var(--navy-700)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th{padding:12px 16px;font-weight:600;text-align:left;background:var(--surface-low)}
td{padding:12px 16px;border-top:1px solid var(--outline-variant)}
.scroll{overflow-x:auto}
.intro{max-width:980px;margin:0 auto;width:100%;padding:32px 24px 48px;display:flex;flex-direction:column;gap:28px}
.auto{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.num{width:26px;height:26px;flex-shrink:0;border-radius:9999px;background:var(--navy-700);color:var(--on-primary);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center}
.num.lt{background:var(--navy-100);color:var(--navy-700)}
ul.l{margin:0;padding-left:20px;line-height:22px}

/* researcher index */
.idx{max-width:980px;margin:0 auto;padding:32px 24px 64px;display:flex;flex-direction:column;gap:20px}
.idx code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--navy-100);padding:2px 6px;border-radius:4px}
.lk{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--outline-variant);flex-wrap:wrap}
.lk .grow{flex:1 1 260px;min-width:0}
.lk a{color:var(--navy-700);font-weight:600;text-decoration:none}.lk a:hover{text-decoration:underline}
.url{font-size:12px;color:var(--on-surface-variant);word-break:break-all}
@media (max-width:900px){.sg{grid-template-columns:minmax(0,1fr) !important}.grid3{grid-template-columns:minmax(0,1fr)}.span2{grid-column:auto}.ticons .ib{display:none}}
@media (prefers-reduced-motion:reduce){.track>div{transition:none}}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  'use strict';
  // Set after first publish so the index shows full links.
  var BASE_URL = '';

  var V = {
    a1: { viewer: 'admin', nav: 'A', act: 'off', data: 'none', widget: 'W1', page: 'dash', gs: 'existing' },
    a2: { viewer: 'admin', nav: 'A', act: 'off', data: 'none', widget: 'W1', page: 'dash', gs: 'guided' },
    a3: { viewer: 'admin', nav: 'A', act: 'off', data: 'none', widget: 'W1', page: 'dash', gs: 'value' },
    a1p: { viewer: 'admin', nav: 'A', act: 'off', data: 'none', widget: 'W1', page: 'intro', gs: 'existing' },
    a2p: { viewer: 'admin', nav: 'A', act: 'off', data: 'none', widget: 'W1', page: 'intro', gs: 'guided' },
    a3p: { viewer: 'admin', nav: 'A', act: 'off', data: 'none', widget: 'W1', page: 'intro', gs: 'value' },
    bp: { viewer: 'user', nav: 'B', act: 'off', data: 'none', widget: 'W1', page: 'intro', gs: 'value' },
    nu2: { viewer: 'user', nav: 'A', act: 'off', data: 'none', widget: 'W1', page: 'dash', gs: 'existing', desc: true },
    p1: { viewer: 'admin', nav: 'A', act: 'off', data: 'none', widget: 'W1', page: 'intro', gs: 'existing' },
    p2: { viewer: 'admin', nav: 'A', act: 'off', data: 'none', widget: 'W1', page: 'intro', gs: 'improved' },
    na: { viewer: 'admin', nav: 'A', act: 'off', data: 'none', widget: 'W1', page: 'dash', gs: 'existing' },
    nu: { viewer: 'user', nav: 'A', act: 'off', data: 'none', widget: 'W1', page: 'dash', gs: 'existing' },
    dA: { viewer: 'admin', nav: 'A', act: 'on', data: 'none', widget: 'W1', page: 'dash', gs: 'existing', dashSet: ['W1', 'W2', 'W3'] },
    dB: { viewer: 'user', nav: 'A', act: 'on', data: 'none', widget: 'W1', page: 'dash', gs: 'value', dashSet: ['W1', 'W2', 'W3'] },
    ac: { viewer: 'admin', nav: 'A', act: 'off', data: 'none', widget: 'W1', page: 'intro', gs: 'existing', compare: ['existing', 'guided', 'value'] },
    b1: { viewer: 'user', nav: 'A', act: 'off', data: 'none', widget: 'W1', page: 'dash', gs: 'value' },
    b2: { viewer: 'user', nav: 'B', act: 'off', data: 'none', widget: 'W1', page: 'dash', gs: 'value' },
    b3: { viewer: 'user', nav: 'C', act: 'off', data: 'none', widget: 'W1', page: 'dash', gs: 'value' },
    bc: { viewer: 'user', nav: 'B', act: 'off', data: 'none', widget: 'W1', page: 'intro', gs: 'existing', compare: ['existing', 'value'] },
    bn: { viewer: 'noperm', nav: 'B', act: 'on', data: 'others', widget: 'W1', page: 'dash', gs: 'existing' }
  };
  var FIXED = 'TEST1';
  var FLOWS = {
    TEST1: [{ key: 'na', name: 'You’re an administrator', noEnable: true }, { key: 'nu', name: 'You’re a content editor' }, { key: 'dA', order: 'random', name: 'Dashboard' }],
    ADMIN: [{ key: 'na' }, { key: 'dA', order: 'random' }],
    USER1: [{ key: 'nu' }, { key: 'dB', order: 'random' }],
    USER2: [{ key: 'nu2' }, { key: 'dB', order: 'random' }],
    DASHBOARD: [{ key: 'dA', order: 'random', name: 'Dashboard' }],
    PAGE1: [{ key: 'p1' }],
    PAGE2: [{ key: 'p2' }]
  };
  var flow = FLOWS[FIXED] || null; var part = 0;

  var root = document.getElementById('root');
  var S = null; var timer = null; var key = '';

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function mi(n, st) { return '<span class="mi" aria-hidden="true"' + (st ? ' style="' + st + '"' : '') + '>' + n + '</span>'; }
  function stop() { if (timer) { clearInterval(timer); timer = null; } }

  function load() {
    stop();
    key = flow ? flow[part].key : FIXED;
    var c = V[key];
    S = c ? Object.assign({}, c, { menu: false, pct: c.act === 'on' ? 100 : 0, planTip: false, promoDismissed: false, createNote: false, rolesNote: false, details: false, bannerDismissed: false, tab: 0 }) : null;
    if (S && S.dashSet) {
      var od = (flow && flow[part].order) || [0, 1, 2];
      if (od === 'random') { od = [0, 1, 2]; for (var r = 2; r > 0; r--) { var j = Math.floor(Math.random() * (r + 1)); var tmp = od[r]; od[r] = od[j]; od[j] = tmp; } }
      S.dash = od.map(function (i) { return S.dashSet[i]; });
      S.dlabels = od.map(function (i) { return 'Dashboard ' + (i + 1); });
      S.widget = S.dash[0];
    }
    if (S && S.compare) {
      var ord = (flow && flow[part].order) || S.compare.map(function (_, i) { return i; });
      S.letters = ord.map(function (i) { return 'ABC'.charAt(i); });
      S.compare = ord.map(function (i) { return S.compare[i]; });
      S.gs = S.compare[0];
    }
    document.title = 'Product Information';
    render();
    window.scrollTo(0, 0);
  }
  function set(p) { var ch = false; for (var k in p) { if (S[k] !== p[k]) { ch = true; break; } } if (!ch) return; Object.assign(S, p); render(); }

  // sample data (prototype only)
  var OTHERS_SIG = [
    { name: 'Missing English descriptions: Spring range', owner: 'Anna Berg', count: '128 entities', status: 'New' },
    { name: 'Products without images: Outdoor', owner: 'Marco Rossi', count: '46 entities', status: 'In Project' }];
  var OTHERS_PROJ = [{ name: 'Spring range copy', owner: 'Anna Berg', done: 84, total: 128 }];

  function derive() {
    var locked = S.act !== 'on', admin = S.viewer === 'admin', noPerm = S.viewer === 'noperm';
    var any = S.data !== 'none';
    var sig = (any && !noPerm) ? OTHERS_SIG : [];
    var proj = (any && !noPerm) ? OTHERS_PROJ : [];
    var showW = false, promo = null;
    if (!locked) {
      if (S.widget === 'W1') showW = any;
      else if (S.widget === 'W2') showW = true;
      else if (S.widget === 'W3') { showW = any; if (!any) promo = noPerm ? 'noperm' : 'post'; }
      else if (S.widget === 'W4') showW = false;
    }
    if (S.promoDismissed) promo = null;
    return { locked: locked, admin: admin, noPerm: noPerm, any: any, sig: sig, proj: proj, showW: showW, promo: promo };
  }

  // ---------- researcher index ----------
  function renderIndex() {
    var groups = {}; var order = [];
    Object.keys(V).forEach(function (k) { var g = V[k].test; if (!groups[g]) { groups[g] = []; order.push(g); } groups[g].push(k); });
    var base = BASE_URL || '[artifact link]';
    var h = '<div class="idx"><header style="display:flex;flex-direction:column;gap:6px">' +
      '<h1 style="font-size:24px;line-height:32px;font-weight:700">Orchestrate Test Links</h1>' +
      '<p class="muted" style="max-width:720px">For the researcher. Each link opens one variant in its starting state, with no prototype controls. Paste the link for each task into UserTesting.com. Participants never see this page.</p>' +
      '<p class="muted" style="max-width:720px">Every link is this page’s link followed by a name such as <code>#t1-b-admin</code>. To restart a variant while checking it, reload the page.</p></header>';
    order.forEach(function (g) {
      h += '<section class="card"><h2 style="padding:14px 16px;font-size:16px;line-height:24px;font-weight:600">' + esc(g) + '</h2>';
      groups[g].forEach(function (k) {
        var full = base + '#' + k;
        h += '<div class="lk"><div class="grow"><a href="#' + k + '">' + esc(V[k].label) + '</a><div class="url">' + esc(full) + '</div></div>' +
          (BASE_URL ? '<button class="btn sm out" data-a="copy" data-k="' + k + '">' + mi('content_copy', 'font-size:16px') + 'Copy Link</button>' : '') + '</div>';
      });
      h += '</section>';
    });
    return h + '</div>';
  }

  // ---------- shell ----------
  function rail(d) {
    var p = S.page, orchOn = p === 'intro' || p === 'signals' || p === 'projects';
    var direct = S.nav === 'C' && d.locked && d.admin;
    var badge = '';
    if (d.locked && S.nav === 'A') badge = '<span class="lockb">' + mi('lock') + '</span>';
    else if ((d.locked && S.nav !== 'A') || !d.locked) badge = '<span class="newb">NEW</span>';
    var h = '<nav class="rail" aria-label="Main">' +
      '<button class="ri" data-a="dash"><span class="pill' + (p === 'dash' ? ' on' : '') + '">' + mi('dashboard') + '</span><span class="rl">Dashboard</span></button>' +
      '<div class="ri static"><span class="pill">' + mi('file_upload') + '</span><span class="rl">Import</span></div>' +
      '<div class="wrap" id="orch"><button class="ri" data-a="orch" aria-haspopup="' + (direct ? 'false' : 'menu') + '" aria-expanded="' + (S.menu && !direct) + '"><span class="pill' + (orchOn ? ' on' : '') + '">' + mi('hub') + badge + '</span><span class="rl">Orchestrate</span></button>';
    if (S.menu && !direct) h += flyout(d);
    h += '</div>' +
      '<div class="ri static"><span class="pill">' + mi('edit_note') + '</span><span class="rl">Enrich</span></div>' +
      '<div class="wrap" id="plan"><button class="ri" data-a="plan" aria-disabled="true"><span class="pill">' + mi('event') + '<span class="lockb">' + mi('lock') + '</span></span><span class="rl">Plan &amp;<br>Release</span></button>' +
      (S.planTip ? '<div class="tip" role="tooltip">Contact your administrator to get access to this new feature.</div>' : '') + '</div>' +
      '<button class="ri" data-a="channel"><span class="pill' + (p === 'channel' ? ' on' : '') + '">' + mi('account_tree') + '<span class="newb">NEW</span></span><span class="rl">Channel<br>Mapper</span></button>' +
      '<div class="ri static" style="margin-top:auto"><span class="pill">' + mi('more_horiz') + '</span><span class="rl">More</span></div></nav>';
    return h;
  }

  function flyout(d) {
    var items = [];
    function it(label, a, o) { var tip = d.admin ? 'Enable Orchestrate to unlock ' + label + '.' : 'Contact your administrator to get access to ' + label + '.'; items.push('<button class="mitem" role="menuitem"' + (o.lock ? ' aria-disabled="true" data-tip="' + tip + '" aria-label="' + label + ', locked. ' + tip + '"' : ' data-a="' + a + '"') + '><span class="grow" style="display:flex;flex-direction:column"><span>' + label + '</span>' + (o.sub ? '<span class="muted" style="font-size:12px;line-height:16px">' + o.sub + '</span>' : '') + '</span>' + (o.lock ? mi('lock', 'font-size:16px;color:var(--on-surface-variant)') : '') + '</button>'); }
    var userInfo = d.locked && !d.admin && (S.nav !== 'A' || S.desc);
    if (d.locked) {
      if (S.nav === 'B' && d.admin) it('Get Started', 'intro', { isNew: true });
      it('Signal Center', '', { lock: true, sub: userInfo ? 'Find products that need work' : '' }); it('Projects', '', { lock: true, sub: userInfo ? 'Assign and track the fixes with your team' : '' });
    } else {
      it('Signal Center', 'signals', { isNew: true }); it('Projects', 'projects', { isNew: true });
      if (S.nav !== 'A') it('Get Started', 'intro', {});
    }
    var note = '', cta = false;
    if (userInfo) {

    var o = document.getElementById('orch');
    if (o) { o.addEventListener('mouseenter', function () { if (!(S.nav === 'C' && S.act !== 'on' && S.viewer === 'admin')) set({ menu: true }); }); o.addEventListener('mouseleave', function () { set({ menu: false }); }); }
    var pl = document.getElementById('plan');
    if (pl) { pl.addEventListener('mouseenter', function () { set({ planTip: true }); }); pl.addEventListener('mouseleave', function () { set({ planTip: false }); }); }
  }

  function go(page) { set({ page: page, menu: false, planTip: false, createNote: false }); window.scrollTo(0, 0); }

  root.addEventListener('click', function (e) {
    var b = e.target.closest('[data-a]'); if (!b) return;
    var a = b.getAttribute('data-a');
    if (a === 'close-note' && e.target.closest('[data-stop]') && !e.target.closest('#tn-ok')) return;
    if (a === 'close-note') { set({ enableNote: false }); return; }
    if (a === 'copy') {
      var url = BASE_URL + '#' + b.getAttribute('data-k');
      try { navigator.clipboard.writeText(url).then(function () { b.innerHTML = mi('check', 'font-size:16px') + 'Copied'; }); } catch (err) { /* clipboard unavailable */ }
      return;
    }
    if (!S) return;
    var locked = S.act !== 'on';
    if (locked && S.viewer !== 'admin' && (a === 'intro' || a === 'signals' || a === 'projects')) return;
    if (a === 'dash') go('dash');
    else if (a === 'intro') go('intro');
    else if (a === 'signals') go(locked ? 'intro' : 'signals');
    else if (a === 'projects') go(locked ? 'intro' : 'projects');
    else if (a === 'channel') go('channel');
    else if (a === 'orch') { if (S.nav === 'C' && locked && S.viewer === 'admin') go('intro'); else set({ menu: !S.menu }); }
    else if (a === 'plan') set({ planTip: !S.planTip, menu: false });
    else if (a === 'dismiss') set({ promoDismissed: true });
    else if (a === 'roles') set({ rolesNote: true });
    else if (a === 'details') set({ details: !S.details });
    else if (a === 'banner-x') set({ bannerDismissed: true });
    else if (a === 'next-part') { if (flow && part < flow.length - 1) { part++; load(); } }
    else if (a === 'dver') { var nd = Math.max(0, Math.min(S.dash.length - 1, S.tab + (+b.getAttribute('data-d')))); set({ tab: nd, widget: S.dash[nd], page: 'dash', promoDismissed: false, menu: false }); window.scrollTo(0, 0); }
    else if (a === 'ver') { var nt = Math.max(0, Math.min(S.compare.length - 1, S.tab + (+b.getAttribute('data-d')))); stop(); set({ tab: nt, gs: S.compare[nt], page: 'intro', act: 'off', pct: 0, details: false, rolesNote: false, menu: false }); window.scrollTo(0, 0); }
    else if (a === 'tab') { var i = +b.getAttribute('data-i'); stop(); set({ tab: i, gs: S.compare[i], page: 'intro', act: 'off', pct: 0, details: false, rolesNote: false, menu: false }); window.scrollTo(0, 0); }
    else if (a === 'create') set({ createNote: true });
    else if (a === 'enable' && flow && flow[part].noEnable) { set({ enableNote: true }); }
    else if (a === 'enable') {
      stop(); set({ act: 'running', pct: 0, page: 'intro', menu: false }); window.scrollTo(0, 0);
      timer = setInterval(function () { var n = S.pct + 4; if (n >= 100) { stop(); set({ pct: 100, act: 'on' }); } else set({ pct: n }); }, 220);
    }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S && (S.menu || S.planTip || S.enableNote)) set({ menu: false, planTip: false, enableNote: false }); });
  document.addEventListener('click', function (e) { if (S && S.menu && !e.target.closest('#orch')) set({ menu: false }); });

  load();
})();
</script>
</body>
</html>
